<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compose Keeper</title><link rel="stylesheet" href="/style.css">
<body><header><div><h1>Compose Keeper</h1><p data-i18n="subtitle">Composeサービスの更新と復旧</p></div><div><label class="language-label">Language / 言語<select id="language" aria-label="Language / 言語"><option value="ja">日本語</option><option value="en">English</option></select></label><button id="logout" data-i18n="logout" hidden>ログアウト</button></div></header>
<main><form id="login"><h2 data-i18n="login">ログイン</h2><label><span data-i18n="key">共通アクセスキー</span><input id="key" type="password" autocomplete="current-password" required></label><button data-i18n="login">ログイン</button></form>
<section id="dashboard" hidden><div class="toolbar"><p id="schedule"></p><button id="run-all" data-i18n="all">すべて更新確認</button></div><form id="schedule-settings" class="schedule-settings"><label><span data-i18n="schedule_time">更新時刻</span><input id="schedule-time" type="time" required></label><label><span data-i18n="timezone">タイムゾーン</span><input id="schedule-timezone" required></label><button data-i18n="save_schedule">時刻を保存</button></form><p id="busy"></p><div class="table-wrap"><table><thead><tr><th data-i18n="project">サービス</th><th data-i18n="version">現在のバージョン / イメージID</th><th data-i18n="backup_state">バックアップ</th><th data-i18n="checked">最終更新確認</th><th data-i18n="updated">最終更新</th><th data-i18n="status">状態</th><th data-i18n="actions">操作</th></tr></thead><tbody id="projects"></tbody></table></div><section id="details" hidden><h2 id="detail-title"></h2><h3 data-i18n="errors">保持しているエラー</h3><pre id="error"></pre><h3 data-i18n="logs">実行ログ</h3><pre id="log"></pre></section></section><p id="message" role="status"></p></main><dialog id="restore-dialog"><h2 data-i18n="restore_title">バックアップから復元</h2><p data-i18n="restore_warning"></p><pre id="restore-summary"></pre><div class="dialog-actions"><button id="restore-cancel" data-i18n="cancel">キャンセル</button><button id="restore-confirm" data-i18n="restore_confirm">復元して起動</button></div></dialog><script src="/i18n.js"></script><script src="/app.js"></script></body></html>
