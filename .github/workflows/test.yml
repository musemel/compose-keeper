name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y rsync acl attr
      - run: python -m pip install -r requirements.txt
      - name: Test in disposable root environment
        run: sudo "$(which python)" -m unittest -v test_keeper.py test_http.py test_metadata.py test_control.py test_settings.py
